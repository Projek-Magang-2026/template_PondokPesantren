<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sesi Selesai — Santri Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" d="M1.371 8.143a.75.75 0 0 1 1.022-.24 15.618 15.618 0 0 1 19.214 0 .75.75 0 1 1-.782 1.28 14.118 14.118 0 0 0-17.65 0 .75.75 0 0 1-1.804-1.04ZM4.143 11.23a.75.75 0 0 1 1.002-.276 11.118 11.118 0 0 1 13.71 0 .75.75 0 1 1-.84 1.246 9.618 9.618 0 0 0-11.87 0 .75.75 0 0 1-1.002-.97ZM6.963 14.28a.75.75 0 0 1 .978-.328 6.618 6.618 0 0 1 8.118 0 .75.75 0 1 1-.896 1.206 5.118 5.118 0 0 0-6.222 0 .75.75 0 0 1-.978-.878ZM9.75 17.25a.75.75 0 0 1 1.097-.66 2.13 2.13 0 0 1 2.306 0 .75.75 0 1 1-.818 1.258.63.63 0 0 0-.67 0 .75.75 0 0 1-.915-.598Z" clip-rule="evenodd" />
            </svg>
            <span>Santri Connect</span>
        </div>
        <span class="header-status" style="color: var(--muted-text); background-color: #F1F5F9;">Offline</span>
    </header>

    <div class="center-layout" style="padding-top: 40px;">
        <div class="center-card">
            <!-- Disconnected Icon -->
            <div class="status-icon" style="background-color: var(--soft-sage); margin: 0 auto 16px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 24px; height: 24px; color: var(--forest-green);">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                </svg>
            </div>

            <h2 class="portal-title" style="margin-bottom: 4px;">Sesi <span>Selesai</span></h2>
            <p class="portal-subtitle" style="margin-bottom: 20px;">Terima kasih telah menggunakan layanan WiFi Santri Connect</p>

            <!-- Session Summary -->
            <div class="receipt-table" style="margin-bottom: 24px;">
                <div class="receipt-row">
                    <span class="receipt-label">User Terputus</span>
                    <span class="receipt-value">$(username)</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Total Uptime</span>
                    <span class="receipt-value highlight">$(uptime)</span>
                </div>
            </div>

            <!-- Return button -->
            <a href="$(link-login)" class="btn-primary" style="text-decoration: none;">
                Masuk Kembali
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </a>

            <footer class="brand-footer" style="margin-top: 24px;">
                &copy; 2026 Santri Connect Hotspot
            </footer>
        </div>
    </div>
</div>

</body>
</html>
