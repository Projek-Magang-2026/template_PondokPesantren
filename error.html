<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Koneksi Gagal — Santri Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="center-layout">
        <div class="center-card">
            <!-- Error Icon -->
            <div class="status-icon" style="background-color: #FEF2F2; margin: 0 auto 16px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#DC2626" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                </svg>
            </div>

            <h2 class="portal-title" style="color: #DC2626; margin-bottom: 4px;">Koneksi Gagal</h2>
            <p class="portal-subtitle" style="margin-bottom: 20px;">Terjadi kesalahan saat mencoba terhubung ke WiFi</p>

            <!-- Error Box -->
            <div class="error-box" style="margin-bottom: 24px; text-align: left;">
                <span>❌</span>
                <div>
                    <strong>Informasi Kendala:</strong><br>
                    <span>$(error-message)</span>
                </div>
            </div>

            <!-- Return button -->
            <a href="login.html" class="btn-primary" style="text-decoration: none;">
                Kembali ke Login
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </a>

            <footer class="brand-footer" style="margin-top: 28px;">
                &copy; 2026 Santri Connect Hotspot
            </footer>
        </div>
    </div>
</div>

</body>
</html>
